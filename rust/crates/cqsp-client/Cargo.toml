[package]
name = "cqsp-client"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
cqsp-core = { path = "../cqsp-core" }
anyhow.workspace = true
image.workspace = true
# Deliberately silent: never enable Bevy audio or its sound-device backends.
bevy = { version = "=0.19.0", default-features = false, features = ["std", "default_app", "bevy_winit", "bevy_pbr", "bevy_ui_render", "bevy_gizmos_render", "bevy_log", "default_font", "multi_threaded", "png", "jpeg"] }
